<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffd400"><title>Yellow Car</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;color:#111}main{max-width:560px;margin:auto;padding:16px 18px 40px}.hero{text-align:center}.logo{width:min(420px,96%);height:auto}.hero h1{font-size:42px;margin:0;font-weight:950}.tag{font-weight:800}.muted{color:#666}.card{border:1px solid #ddd;border-radius:24px;padding:20px;margin-top:18px}.hidden{display:none}.pick,.score,.hist{display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:18px;padding:15px;margin-top:10px;font-size:19px;font-weight:800}.pick input{width:25px;height:25px}.primary{width:100%;padding:17px;margin-top:18px;border:0;border-radius:18px;background:#111;color:#ffd400;font-size:19px;font-weight:900}.top{display:flex;justify-content:space-between}.total{font-size:34px;font-weight:950}.timer{border:1px solid #ddd;border-radius:12px;padding:9px}.plus{width:60px;height:60px;border:0;border-radius:50%;background:#ffd400;font-size:34px;font-weight:950}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.actions button{padding:15px;border-radius:16px;font-weight:850}.finish{background:#111;color:#ffd400;border:0}.undo{background:#fff;border:1px solid #ccc}.flash{position:sticky;top:8px;background:#ffd400;border:2px solid #111;border-radius:17px;padding:14px;text-align:center;font-size:20px;font-weight:950;z-index:3}.winner{text-align:center;font-size:34px;font-weight:950}</style></head><body><main>
<section class="hero"><img class="logo" src="yellow-car.png" alt="Fun yellow cartoon car"><h1>YELLOW CAR</h1><div class="tag">Spot it. Say it. Score it.</div><div class="muted">Stuart &amp; Sabine Edition</div></section>
<div id="flash" class="flash hidden"></div><section id="setup" class="card"><h2>Who's playing?</h2><label class="pick">😎 Stuart <input id="stuart" type="checkbox" checked></label><label class="pick">😊 Sabine <input id="sabine" type="checkbox" checked></label><button id="start" class="primary">🚗 Start game</button><div id="history"></div></section>
<section id="game" class="card hidden"><div class="top"><div><div id="total" class="total">0 yellow cars</div><div class="muted">Ready when you are</div></div><div id="timer" class="timer">00:00</div></div><div id="scores"></div><div class="actions"><button id="undo" class="undo">↶ Undo</button><button id="finish" class="finish">Finish trip</button></div><p class="muted" style="text-align:center;font-size:13px">Passenger operates the game. Driver keeps eyes on the road.</p></section>
<section id="result" class="card hidden"><div style="text-align:center;font-size:52px">🏆</div><div id="winner" class="winner"></div><p id="summary" class="muted" style="text-align:center"></p><div id="final"></div><button id="again" class="primary">🚗 Start new trip</button></section>
<script>
const $=s=>document.querySelector(s);let players=[],hits=[],seconds=0,tick,startTime=0;
const ACTIVE='yellowCarSSActiveTrip';
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'),total=()=>players.reduce((a,p)=>a+p.score,0);
function elapsed(){return startTime?Math.max(0,Math.floor((Date.now()-startTime)/1000)):0}
function updateTimer(){seconds=elapsed();$('#timer').textContent=fmt(seconds)}
function saveActive(){if(startTime)localStorage.setItem(ACTIVE,JSON.stringify({startTime,players,hits}))}
function clearActive(){localStorage.removeItem(ACTIVE)}
function flash(p){let f=$('#flash');f.textContent='YELLOW CAR! 🚗 +1 '+p.name.toUpperCase()+'!';f.classList.remove('hidden');setTimeout(()=>f.classList.add('hidden'),900)}
function render(){$('#total').textContent=total()+' yellow car'+(total()==1?'':'s');let s=$('#scores');s.innerHTML='';players.forEach((p,i)=>{let r=document.createElement('div');r.className='score';let a=document.createElement('span');a.textContent=p.icon+' '+p.name+' · '+p.score;let b=document.createElement('button');b.className='plus';b.textContent='+';b.onclick=()=>{p.score++;hits.push(i);saveActive();flash(p);render()};r.append(a,b);s.append(r)});$('#undo').disabled=!hits.length}
function hist(){let h=JSON.parse(localStorage.getItem('yellowCarSS')||'[]'),x=$('#history');x.innerHTML=h.length?'<h3>Recent trips</h3>':'';h.slice(0,5).forEach(t=>{let d=document.createElement('div');d.className='hist';d.textContent=t.date+' — '+t.winner+' · '+t.total+' yellow cars';x.append(d)})}
function showGame(){$('#setup').classList.add('hidden');$('#result').classList.add('hidden');$('#game').classList.remove('hidden');render();clearInterval(tick);updateTimer();tick=setInterval(updateTimer,1000)}
function restoreActive(){try{let x=JSON.parse(localStorage.getItem(ACTIVE)||'null');if(!x||!x.startTime||!Array.isArray(x.players))return false;startTime=Number(x.startTime);players=x.players;hits=Array.isArray(x.hits)?x.hits:[];showGame();return true}catch(e){clearActive();return false}}
$('#start').onclick=()=>{players=[];if($('#stuart').checked)players.push({name:'Stuart',icon:'😎',score:0});if($('#sabine').checked)players.push({name:'Sabine',icon:'😊',score:0});if(!players.length)return alert('Pick at least one player.');hits=[];seconds=0;startTime=Date.now();saveActive();showGame()}
$('#undo').onclick=()=>{let i=hits.pop();if(i!==undefined&&players[i].score)players[i].score--;saveActive();render()}
$('#finish').onclick=()=>{updateTimer();clearInterval(tick);clearActive();$('#game').classList.add('hidden');$('#result').classList.remove('hidden');let m=Math.max(...players.map(p=>p.score)),w=players.filter(p=>p.score===m).map(p=>p.name),wl=w.length>1?'Draw':w[0]+' wins';$('#winner').textContent=w.length>1?'It’s a draw! 🎉':w[0]+' wins! 🎉';$('#summary').textContent='You spotted '+total()+' yellow cars in '+fmt(seconds)+'.';let f=$('#final');f.innerHTML='';players.forEach(p=>{let d=document.createElement('div');d.className='score';d.textContent=p.icon+' '+p.name+' — '+p.score;f.append(d)});let h=JSON.parse(localStorage.getItem('yellowCarSS')||'[]');h.unshift({date:new Date().toLocaleDateString('en-AU'),winner:wl,total:total(),duration:seconds});localStorage.setItem('yellowCarSS',JSON.stringify(h.slice(0,50)))}
$('#again').onclick=()=>location.reload();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&startTime)updateTimer()});
window.addEventListener('pageshow',()=>{if(startTime)updateTimer()});
hist();restoreActive();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></main></body></html>
