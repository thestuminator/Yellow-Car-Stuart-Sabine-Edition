<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffd400"><title>Yellow Car</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;color:#111}main{max-width:560px;margin:auto;padding:20px 18px 40px}.hero{text-align:center}.logo{width:min(340px,90%)}h1{font-size:42px;margin:0;font-weight:950}.tag{font-weight:800}.muted{color:#666}.card{border:1px solid #ddd;border-radius:24px;padding:20px;margin-top:18px}.hidden{display:none}.pick,.score,.hist{display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:18px;padding:15px;margin-top:10px;font-size:19px;font-weight:800}.pick input{width:25px;height:25px}.primary{width:100%;padding:17px;margin-top:18px;border:0;border-radius:18px;background:#111;color:#ffd400;font-size:19px;font-weight:900}.top{display:flex;justify-content:space-between}.total{font-size:34px;font-weight:950}.timer{border:1px solid #ddd;border-radius:12px;padding:9px}.plus{width:60px;height:60px;border:0;border-radius:50%;background:#ffd400;font-size:34px;font-weight:950}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.actions button{padding:15px;border-radius:16px;font-weight:850}.finish{background:#111;color:#ffd400;border:0}.undo{background:#fff;border:1px solid #ccc}.flash{position:sticky;top:8px;background:#ffd400;border:2px solid #111;border-radius:17px;padding:14px;text-align:center;font-size:20px;font-weight:950}.winner{text-align:center;font-size:34px;font-weight:950}</style></head><body><main>
<section class="hero"><svg class="logo" viewBox="0 0 620 270"><g stroke="#111" stroke-width="10" stroke-linejoin="round"><path fill="#ffd400" d="M72 176c7-47 32-75 77-84l75-9 49-54h126c34 0 66 20 82 51l18 35 50 18c21 8 33 24 33 46v20H72z"/><path fill="#78d7ff" d="M254 82l38-42h99c25 0 48 14 61 35l5 7z"/><circle fill="#222" cx="178" cy="196" r="48"/><circle fill="#ddd" cx="178" cy="196" r="24"/><circle fill="#222" cx="475" cy="196" r="48"/><circle fill="#ddd" cx="475" cy="196" r="24"/></g><text x="350" y="158" text-anchor="middle" font-size="48" font-family="Arial" font-weight="900">Yellow Car</text></svg><h1>YELLOW CAR</h1><div class="tag">Spot it. Say it. Score it.</div><div class="muted">Stuart &amp; Sabine Edition</div></section>
<div id="flash" class="flash hidden"></div><section id="setup" class="card"><h2>Who's playing?</h2><label class="pick">😎 Stuart <input id="stuart" type="checkbox" checked></label><label class="pick">😊 Sabine <input id="sabine" type="checkbox" checked></label><button id="start" class="primary">🚗 Start game</button><div id="history"></div></section>
<section id="game" class="card hidden"><div class="top"><div><div id="total" class="total">0 yellow cars</div><div class="muted">Ready when you are</div></div><div id="timer" class="timer">00:00</div></div><div id="scores"></div><div class="actions"><button id="undo" class="undo">↶ Undo</button><button id="finish" class="finish">Finish trip</button></div><p class="muted" style="text-align:center;font-size:13px">Passenger operates the game. Driver keeps eyes on the road.</p></section>
<section id="result" class="card hidden"><div style="text-align:center;font-size:52px">🏆</div><div id="winner" class="winner"></div><p id="summary" class="muted" style="text-align:center"></p><div id="final"></div><button id="again" class="primary">🚗 Start new trip</button></section>
<script>
const $=s=>document.querySelector(s);let players=[],hits=[],seconds=0,tick;const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'),total=()=>players.reduce((a,p)=>a+p.score,0);
function flash(p){let f=$('#flash');f.textContent='YELLOW CAR! 🚗 +1 '+p.name.toUpperCase()+'!';f.classList.remove('hidden');setTimeout(()=>f.classList.add('hidden'),900)}
function render(){$('#total').textContent=total()+' yellow car'+(total()==1?'':'s');let s=$('#scores');s.innerHTML='';players.forEach((p,i)=>{let r=document.createElement('div');r.className='score';let a=document.createElement('span');a.textContent=p.icon+' '+p.name+' · '+p.score;let b=document.createElement('button');b.className='plus';b.textContent='+';b.onclick=()=>{p.score++;hits.push(i);flash(p);render()};r.append(a,b);s.append(r)});$('#undo').disabled=!hits.length}
function hist(){let h=JSON.parse(localStorage.getItem('yellowCarSS')||'[]'),x=$('#history');x.innerHTML=h.length?'<h3>Recent trips</h3>':'';h.slice(0,5).forEach(t=>{let d=document.createElement('div');d.className='hist';d.textContent=t.date+' — '+t.winner+' · '+t.total+' yellow cars';x.append(d)})}
$('#start').onclick=()=>{players=[];if($('#stuart').checked)players.push({name:'Stuart',icon:'😎',score:0});if($('#sabine').checked)players.push({name:'Sabine',icon:'😊',score:0});if(!players.length)return alert('Pick at least one player.');hits=[];seconds=0;$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');render();clearInterval(tick);tick=setInterval(()=>$('#timer').textContent=fmt(++seconds),1000)}
$('#undo').onclick=()=>{let i=hits.pop();if(i!==undefined&&players[i].score)players[i].score--;render()}
$('#finish').onclick=()=>{clearInterval(tick);$('#game').classList.add('hidden');$('#result').classList.remove('hidden');let m=Math.max(...players.map(p=>p.score)),w=players.filter(p=>p.score===m).map(p=>p.name),wl=w.length>1?'Draw':w[0]+' wins';$('#winner').textContent=w.length>1?'It’s a draw! 🎉':w[0]+' wins! 🎉';$('#summary').textContent='You spotted '+total()+' yellow cars in '+fmt(seconds)+'.';let f=$('#final');f.innerHTML='';players.forEach(p=>{let d=document.createElement('div');d.className='score';d.textContent=p.icon+' '+p.name+' — '+p.score;f.append(d)});let h=JSON.parse(localStorage.getItem('yellowCarSS')||'[]');h.unshift({date:new Date().toLocaleDateString('en-AU'),winner:wl,total:total()});localStorage.setItem('yellowCarSS',JSON.stringify(h.slice(0,50)))}
$('#again').onclick=()=>location.reload();hist();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></main></body></html>
